<!DOCTYPE html>
<html class="dark" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HYROX</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/app.css">
<script src="/i18n.js"></script>
<style>
  body { font-family: "Archivo Narrow", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  h1, h2 { font-family: "Bebas Neue", "PingFang TC", "Noto Sans TC", sans-serif; letter-spacing: .04em; }
  /* An entrant fills this in on their own phone, standing up, one-handed. */
  button, input { min-height: 52px; font-size: 17px; }
  .code { font-family: "JetBrains Mono", monospace; letter-spacing: .18em; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen">

<header class="border-b border-outline-variant bg-surface-container-lowest">
  <div class="max-w-xl mx-auto px-4 py-3 flex items-center gap-3">
    <h1 class="text-2xl text-primary">HYROX</h1>
    <span class="text-lg" data-i18n="signup.title">Race entry</span>
    <span class="ml-auto flex items-center gap-3"><span class="text-xs tracking-widest text-on-surface-variant">uCareMedi.com</span><span id="lang" class="flex gap-1 text-xs"></span></span>
  </div>
  <div id="toast" class="hidden px-4 py-2 text-sm"></div>
</header>

<main class="max-w-xl mx-auto px-4 py-6 space-y-6">

  <!-- Before entering. -->
  <section id="view-form" class="space-y-4">
    <p class="text-on-surface-variant" data-i18n="signup.lead"></p>
    <label class="block">
      <span class="block text-sm text-on-surface-variant mb-1" data-i18n="signup.name">Name</span>
      <input id="name" autocomplete="name"
             class="w-full bg-surface-container-high border border-outline-variant rounded px-3 py-3"/>
    </label>
    <button id="submit" class="w-full bg-primary text-on-primary font-semibold rounded px-5 py-3"
            data-i18n="signup.submit">Enter</button>

    <details class="pt-4 border-t border-outline-variant">
      <summary class="cursor-pointer text-sm text-on-surface-variant" data-i18n="signup.reopen"></summary>
      <div class="flex gap-2 mt-3">
        <input id="lookup-code" maxlength="9" autocapitalize="characters" spellcheck="false"
               class="code flex-1 bg-surface-container-high border border-outline-variant rounded px-3 py-3 uppercase"/>
        <button id="lookup" class="border border-outline rounded px-4" data-i18n="signup.lookup"></button>
      </div>
    </details>
  </section>

  <!-- After entering: the pass. This is the screen the entrant keeps. -->
  <section id="view-pass" class="hidden space-y-5">
    <div class="text-center">
      <p class="text-primary text-lg" data-i18n="signup.done"></p>
      <p id="pass-name" class="text-3xl mt-1"></p>
      <p id="pass-bib" class="text-on-surface-variant"></p>
    </div>

    <div class="bg-surface-container rounded-lg border border-outline-variant p-5 text-center">
      <p class="text-xs text-on-surface-variant mb-2" data-i18n="signup.yourCode"></p>
      <p id="pass-code" class="code text-4xl text-primary"></p>
      <!-- Drawn by the hub, not a CDN: a venue with no internet still hands out entries. -->
      <img id="pass-qr" alt="" class="mx-auto mt-4 w-56 h-56 bg-white rounded p-2"/>
      <p class="text-sm text-on-surface-variant mt-3" data-i18n="signup.showAtDesk"></p>
    </div>

    <p class="text-sm text-on-surface-variant" data-i18n="signup.keep"></p>

    <div id="pass-status" class="bg-surface-container rounded-lg border border-outline-variant p-4">
      <p class="text-xs text-on-surface-variant" data-i18n="signup.status"></p>
      <p id="status-line" class="text-2xl mt-1"></p>
      <p id="result-line" class="text-on-surface-variant mt-1"></p>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let CODE = null;
let TIMER = null;

function toast(message, bad) {
  const el = $("toast");
  el.textContent = message;
  el.className = "px-4 py-2 text-sm " + (bad ? "bg-error text-on-error" : "bg-primary text-on-primary");
  setTimeout(() => el.classList.add("hidden"), 4000);
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? { "content-type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(I18N.t("err." + data.error) || data.message || "");
  return data;
}

$("submit").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) return toast(I18N.t("signup.namePlaceholder"), true);
  try {
    const entry = await api("POST", "/api/checkin/signup", { display_name: name });
    showPass(entry.code, entry.display_name, entry.bib);
  } catch (e) {
    toast(e.message || I18N.t("err.unknown"), true);
  }
};

$("lookup").onclick = () => {
  const code = $("lookup-code").value.trim();
  if (code) location.search = "?code=" + encodeURIComponent(code);
};

/// The pass: code, QR, and how the class is going. The URL carries the code so the entrant
/// can bookmark it, screenshot it, or reopen it after closing the tab -- their phone is the
/// only place this lives, because the hub has no accounts to log back into (ADR 0011).
function showPass(code, name, bib) {
  CODE = code;
  history.replaceState(null, "", "?code=" + encodeURIComponent(code));
  $("view-form").classList.add("hidden");
  $("view-pass").classList.remove("hidden");
  $("pass-code").textContent = code;
  $("pass-qr").src = "/api/entry/" + encodeURIComponent(code) + "/qr.svg";
  if (name) $("pass-name").textContent = name;
  if (bib) $("pass-bib").textContent = I18N.t("signup.bib") + " " + bib;
  refresh();
  if (TIMER) clearInterval(TIMER);
  TIMER = setInterval(refresh, 5000);
}

async function refresh() {
  if (!CODE) return;
  let entry;
  try {
    entry = await api("GET", "/api/entry/" + encodeURIComponent(CODE));
  } catch (e) {
    return;                            // The class may not have started; keep the pass up.
  }
  const row = entry.row;
  $("pass-name").textContent = row.name;
  if (row.bib) $("pass-bib").textContent = I18N.t("signup.bib") + " " + row.bib;

  const status = { READY: "signup.notStarted", ACTIVE: "signup.racing", FINISHED: "signup.finished" };
  $("status-line").textContent = I18N.t(status[row.status] || "signup.notStarted");

  const parts = [];
  if (entry.session_name) parts.push(entry.session_name);
  parts.push(I18N.t("signup.stations").replace("{0}", row.stations_completed)
                                      .replace("{1}", entry.course_length));
  if (row.elapsed_ms != null) parts.push(clock(row.elapsed_ms));
  // A blank place means this class has no places at all, not that they came nowhere
  // (ADR 0010). Say which.
  if (row.place != null) parts.push(I18N.t("signup.place").replace("{0}", row.place));
  else if (entry.ordering !== "FINISH_TIME") parts.push(I18N.t("signup.noPlace"));
  $("result-line").textContent = parts.join(" · ");
}

function clock(ms) {
  const total = Math.floor(ms / 1000);
  return String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
}

I18N.apply();
I18N.switcher($("lang"));
$("name").placeholder = I18N.t("signup.namePlaceholder");
const asked = new URLSearchParams(location.search).get("code");
if (asked) showPass(asked.toUpperCase(), "", null);
</script>
</body></html>
