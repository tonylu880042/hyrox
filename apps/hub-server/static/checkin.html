<!DOCTYPE html>
<html class="dark" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HYROX</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/app.css">
<script src="/i18n.js"></script>
<style>
  body { font-family: "Archivo Narrow", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  h1, h2 { font-family: "Bebas Neue", "PingFang TC", "Noto Sans TC", sans-serif; letter-spacing: .04em; }
  /* A helper on the door taps this with a thumb, often in a hurry. */
  button, select, input { min-height: 48px; font-size: 16px; }
  .tag-chip { font-family: "JetBrains Mono", monospace; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen">

<header class="border-b border-outline-variant bg-surface-container-lowest sticky top-0 z-20">
  <div class="max-w-5xl mx-auto px-4 py-2 flex flex-wrap items-center gap-x-4 gap-y-1">
    <h1 class="text-2xl sm:text-3xl text-primary">HYROX</h1>
    <span class="text-lg" data-i18n="checkin.title">Check-in</span>
    <div class="ml-auto flex items-center gap-3 text-xs text-on-surface-variant whitespace-nowrap">
      <span id="freshness" class="font-mono"></span>
      <span class="text-xs tracking-widest text-on-surface-variant">uCareMedi.com</span>
      <span id="lang" class="flex gap-1"></span>
    </div>
  </div>
  <div id="toast" class="hidden px-4 py-2 text-sm"></div>
  <div id="net-banner" class="hidden text-center text-xs py-1 px-3" style="background-color:#d97706; color:#ffffff;">
    <span data-i18n="net.reconnecting"></span>
  </div>
</header>

<dialog id="ask" class="bg-surface-container text-on-surface border border-outline-variant rounded-lg p-0 backdrop:bg-black/60">
  <form method="dialog" class="p-5 w-[22rem] max-w-[90vw]">
    <h2 id="ask-title" class="text-2xl mb-3"></h2>
    <input id="ask-input" class="w-full bg-surface-container-high border border-outline-variant rounded px-3 py-2 mb-4"/>
    <div class="flex gap-2 justify-end">
      <button value="" class="border border-outline rounded px-4 py-2" data-i18n="action.cancel"></button>
      <button value="ok" class="bg-primary text-on-primary font-semibold px-4 py-2 rounded" data-i18n="action.ok"></button>
    </div>
  </form>
</dialog>

<main class="max-w-5xl mx-auto p-4 grid gap-4 lg:grid-cols-2">

  <!-- Adding somebody. A walk-in needs a name and nothing else (ADR 0010). -->
  <section class="bg-surface-container rounded-lg border border-outline-variant p-4">
    <h2 class="text-xl mb-3" data-i18n="checkin.entrants">Entrants</h2>
    <form id="entrant-form" class="flex flex-wrap gap-2 items-end mb-4">
      <label class="flex-1 min-w-[10rem]">
        <span class="block text-xs text-on-surface-variant mb-1" data-i18n="checkin.name"></span>
        <input id="e-name" required class="w-full bg-surface-container-high border border-outline-variant rounded px-3 py-2"/>
      </label>
      <label class="w-24">
        <span class="block text-xs text-on-surface-variant mb-1" data-i18n="checkin.bib"></span>
        <input id="e-bib" type="number" min="1" class="w-full bg-surface-container-high border border-outline-variant rounded px-3 py-2 font-mono"/>
      </label>
      <label class="w-full sm:w-40">
        <span class="block text-xs text-on-surface-variant mb-1" data-i18n="checkin.memberId"></span>
        <input id="e-member" class="w-full bg-surface-container-high border border-outline-variant rounded px-3 py-2 font-mono"/>
      </label>
      <button class="bg-primary text-on-primary font-semibold px-4 py-2 rounded" data-i18n="checkin.add"></button>
    </form>
    <ul id="entrants" class="flex flex-col gap-2"></ul>
  </section>

  <!-- Finding an entrant who registered on their own phone (ADR 0011). A barcode scanner
       is a keyboard: it types the six characters here and presses Enter. The camera is the
       fallback for a desk with no scanner. -->
  <section class="bg-surface-container rounded-lg border border-outline-variant p-4">
    <h2 class="text-xl mb-1" data-i18n="checkin.findCode">Entry code</h2>
    <p class="text-sm text-on-surface-variant mb-3" data-i18n="checkin.findCodeHint"></p>
    <div class="flex flex-wrap gap-2">
      <input id="code" maxlength="9" autocapitalize="characters" spellcheck="false"
             class="tag-chip flex-1 min-w-[9rem] bg-surface-container-high border border-outline-variant rounded px-3 py-2 uppercase"/>
      <button id="scan" class="border border-outline rounded px-4 py-2" data-i18n="checkin.scan"></button>
    </div>
    <video id="cam" class="hidden w-full max-w-sm mt-3 rounded border border-outline-variant" muted playsinline></video>
    <p id="code-found" class="mt-3"></p>
  </section>

  <!-- Bands a reader has seen that belong to nobody yet. -->
  <section class="bg-surface-container rounded-lg border border-outline-variant p-4">
    <h2 class="text-xl mb-3" data-i18n="checkin.pending">Bands waiting</h2>
    <ul id="pending" class="flex flex-col gap-2"></ul>
  </section>
</main>

<script>
"use strict";

let DEVICE = localStorage.getItem("hyrox.device") || "";
let VIEW = { pending: [], athletes: [] };

function ask(title, value = "") {
  const dialog = document.getElementById("ask");
  const input = document.getElementById("ask-input");
  document.getElementById("ask-title").textContent = title;
  input.value = value;
  dialog.showModal(); input.focus(); input.select();
  return new Promise((resolve) => {
    dialog.addEventListener("close", () => resolve(dialog.returnValue === "ok" ? input.value.trim() : ""), { once: true });
  });
}

async function device() {
  if (!DEVICE) {
    DEVICE = await ask(I18N.t("ask.device"), I18N.t("ask.deviceDefault"));
    if (!DEVICE) throw new Error(I18N.t("toast.deviceNeeded"));
    localStorage.setItem("hyrox.device", DEVICE);
  }
  return DEVICE;
}

function updateNetStatus(online) {
  const banner = document.getElementById("net-banner");
  if (!banner) return;
  if (!online) {
    banner.classList.remove("hidden");
    banner.style.backgroundColor = "#d97706";
    banner.textContent = I18N.t("net.reconnecting");
  } else if (!banner.classList.contains("hidden")) {
    banner.style.backgroundColor = "#059669";
    banner.textContent = I18N.t("net.restored");
    setTimeout(() => banner.classList.add("hidden"), 2500);
  }
}

let audioCtx = null;
function playChime(success = false) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (success) {
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else {
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    }
  } catch (e) {}
}

async function api(method, path, body) {
  const headers = {};
  if (method !== "GET") {
    headers["content-type"] = "application/json";
    // `fetch` throws on a header value outside ISO-8859-1, so a device named 「櫃檯平板」
    // would never leave the tab. Escaped here, decoded back by the hub (ADR 0001 D1).
    headers["x-operator-device"] = encodeURIComponent(await device());
  }
  let res;
  try {
    res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    updateNetStatus(true);
  } catch (err) {
    updateNetStatus(false);
    throw err;
  }
  const text = await res.text();
  const json = text ? JSON.parse(text) : {};
  if (!res.ok) throw Object.assign(new Error(json.error || "unknown"), { code: json.error, detail: json.message });
  return json;
}

function explain(e) {
  if (e && e.code) { const k = "err." + e.code, t = I18N.t(k); if (t !== k) return t; }
  return I18N.t("err.unknown");
}

function toast(msg, bad) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "px-4 py-2 text-sm " + (bad ? "bg-error-container text-on-surface" : "bg-surface-container-high");
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.className = "hidden"), 4000);
}

async function guard(fn) {
  try { await fn(); } catch (e) {
    if (e && e.detail) console.warn(e.code, e.detail);
    toast(e && e.code ? explain(e) : (e && e.message) || String(e), true);
  }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

// ── The roster ────────────────────────────────────────────────────────────────
function renderEntrants() {
  const host = document.getElementById("entrants");
  host.innerHTML = "";
  if (!VIEW.athletes.length) {
    host.innerHTML = '<li class="text-on-surface-variant">' + esc(I18N.t("checkin.noEntrants")) + "</li>";
    return;
  }
  for (const a of VIEW.athletes) {
    const li = document.createElement("li");
    li.className = "flex items-center gap-3 bg-surface-container-high rounded border border-outline-variant px-3 py-2";
    li.innerHTML = `
      <span class="font-mono text-on-surface-variant w-8 text-right">${a.bib ?? ""}</span>
      <span class="flex-1">${esc(a.name)}</span>
      <span class="text-xs px-2 py-1 rounded ${a.tag_id ? "bg-primary text-on-primary" : "border border-outline text-on-surface-variant"}">
        ${esc(I18N.t(a.tag_id ? "checkin.bound" : "checkin.unbound"))}</span>`;
    host.appendChild(li);
  }
}

// ── Finding an entrant by their code (ADR 0011) ───────────────────────────────
// The code is the athlete id, so "look them up" is a filter over the roster we already
// hold -- no extra request, and it works while the desk's connection is flaky.
function findByCode(raw) {
  const code = String(raw || "").trim().toUpperCase().replace(/[\s_-]/g, "")
    .replace(/O/g, "0").replace(/[IL]/g, "1");
  const found = VIEW.athletes.find((a) => a.athlete_id === code);
  const out = document.getElementById("code-found");
  if (!found) {
    out.className = "mt-3 text-error";
    out.textContent = I18N.t("checkin.codeNotFound").replace("{0}", code);
    return null;
  }
  out.className = "mt-3";
  out.textContent = `${found.bib ?? ""} ${found.name} — ${I18N.t(found.tag_id ? "checkin.bound" : "checkin.unbound")}`;
  // Pre-select them on every band waiting to be claimed, so the next tap binds to them.
  document.querySelectorAll("#pending select.who").forEach((sel) => (sel.value = found.athlete_id));
  return found;
}

document.getElementById("code").addEventListener("keydown", (e) => {
  // A scanner ends its burst with Enter. A person presses it too.
  if (e.key === "Enter") { e.preventDefault(); findByCode(e.target.value); }
});
document.getElementById("code").addEventListener("input", (e) => {
  if (e.target.value.replace(/[\s_-]/g, "").length >= 6) findByCode(e.target.value);
});

// Camera scanning uses the browser's own BarcodeDetector -- no library to vendor, nothing
// to load from a CDN. It needs a secure context, which plain http on a venue LAN is not,
// so this is the fallback and the scanner is the plan.
let STREAM = null;
document.getElementById("scan").onclick = async () => {
  const video = document.getElementById("cam");
  if (STREAM) {
    STREAM.getTracks().forEach((t) => t.stop());
    STREAM = null;
    video.classList.add("hidden");
    document.getElementById("scan").textContent = I18N.t("checkin.scan");
    return;
  }
  if (!window.isSecureContext) return toast(I18N.t("checkin.scanInsecure"), true);
  if (!("BarcodeDetector" in window)) return toast(I18N.t("checkin.scanUnavailable"), true);
  try {
    STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    return toast(I18N.t("checkin.scanUnavailable"), true);
  }
  video.srcObject = STREAM;
  video.classList.remove("hidden");
  await video.play();
  document.getElementById("scan").textContent = I18N.t("checkin.scanStop");
  const detector = new BarcodeDetector({ formats: ["qr_code"] });
  const tick = async () => {
    if (!STREAM) return;
    try {
      const [hit] = await detector.detect(video);
      if (hit && findByCode(hit.rawValue)) {
        document.getElementById("code").value = hit.rawValue;
        document.getElementById("scan").click();
        return;
      }
    } catch (e) { /* a frame that did not decode is the normal case */ }
    setTimeout(tick, 300);
  };
  tick();
};

// ── Bands nobody owns yet ─────────────────────────────────────────────────────
function renderPending() {
  const host = document.getElementById("pending");
  host.innerHTML = "";
  if (!VIEW.pending.length) {
    host.innerHTML = '<li class="text-on-surface-variant">' + esc(I18N.t("checkin.noPending")) + "</li>";
    return;
  }
  for (const tag of VIEW.pending) {
    const li = document.createElement("li");
    li.className = "flex flex-wrap items-center gap-2 bg-surface-container-high rounded border border-outline-variant px-3 py-2";
    const options = VIEW.athletes
      .filter((a) => !a.tag_id)
      .map((a) => `<option value="${esc(a.athlete_id)}">${a.bib ?? ""} · ${esc(a.name)}</option>`)
      .join("");
    li.innerHTML = `
      <span class="tag-chip flex-1 min-w-[9rem] text-primary">${esc(tag)}</span>
      <select class="who bg-surface-container border border-outline-variant rounded px-2 py-2 flex-1 min-w-[9rem]">
        <option value="">${esc(I18N.t("checkin.pick"))}</option>${options}
      </select>
      <button class="bind bg-primary text-on-primary font-semibold px-4 py-2 rounded" data-tag="${esc(tag)}">
        ${esc(I18N.t("checkin.bindTo"))}</button>`;
    li.querySelector(".bind").onclick = () => guard(async () => {
      const athlete_id = li.querySelector(".who").value;
      if (!athlete_id) return toast(I18N.t("checkin.pick"), true);
      const res = await api("POST", "/api/checkin/bind", { tag_id: tag, athlete_id });
      const who = VIEW.athletes.find((a) => a.athlete_id === athlete_id);
      // Reads that happened before anyone owned the band are claimed retroactively; saying
      // so matters, because those splits appear on the screen a moment later.
      const claimed = (res.claimed || []).length;
      playChime(true);
      toast(I18N.t("checkin.boundOk", who ? who.name : athlete_id) +
            (claimed ? " " + I18N.t("checkin.claimed", claimed) : ""));
      await refresh();
    });
    host.appendChild(li);
  }
}

document.getElementById("entrant-form").onsubmit = (ev) => {
  ev.preventDefault();
  guard(async () => {
    const name = document.getElementById("e-name").value.trim();
    const bib = document.getElementById("e-bib").value;
    const member = document.getElementById("e-member").value.trim();
    await api("POST", "/api/checkin/entrants", {
      display_name: name,
      bib: bib === "" ? null : +bib,
      member_id: member === "" ? null : member,
    });
    toast(I18N.t("checkin.added", name));
    document.getElementById("entrant-form").reset();
    document.getElementById("e-name").focus();
    await refresh();
  });
};

let PREV_PENDING = [];

async function refresh() {
  const res = await api("GET", "/api/checkin");
  const newPending = (res.pending || []).filter((t) => !PREV_PENDING.includes(t));
  if (newPending.length > 0 && PREV_PENDING.length > 0) {
    playChime(false);
  }
  PREV_PENDING = res.pending || [];
  VIEW = { pending: res.pending, athletes: res.athletes };
  const f = res.freshness;
  document.getElementById("freshness").textContent =
    f.last_event_age_ms == null ? I18N.t("freshness.none")
                                : I18N.t("freshness.ago", Math.round(f.last_event_age_ms / 1000) + "s");
  renderEntrants();
  renderPending();
}

I18N.apply();
I18N.switcher(document.getElementById("lang"));
guard(refresh);
// The pending list is polled: the WebSocket carries a count, not the tags themselves, and
// changing that frame shape would break the live screen (roadmap, known gaps).
setInterval(() => guard(refresh), 2000);
</script>
</body></html>
