# The hub is the venue's time authority (CLAUDE.md 17). Edge boards have no battery clock
# and ask the broker's host for the time over SNTP; this is what answers them. It is the
# second source -- the hub also broadcasts its clock on hyrox/v1/hub/time.
allow

# Keep answering with no internet. Without this an unsynchronised chrony stops serving, and
# a venue whose uplink is down is exactly where the boards still need a clock. Any stratum
# but 0 will do: the firmware's SNTP client only rejects 0.
local stratum 10
