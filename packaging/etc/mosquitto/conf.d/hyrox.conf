# Edge boards reach the broker over the venue LAN (firmware protocol v1.1 section 2.1).
#
# Mosquitto 2.x listens on localhost only until a listener is declared, and refuses
# anonymous clients as soon as one is. Both lines are needed: with only the first, the hub
# on this machine works and every board on the LAN is turned away.
#
# Anonymous because the firmware carries no credentials and cannot do TLS. The boundary is
# the network: this port belongs on a segment only the boards and staff devices can reach
# (docs/open-issues.md, production networking).
listener 1883 0.0.0.0
allow_anonymous true

# Ubuntu's mosquitto.conf already turns persistence on. A board holds its QoS 1 session
# across a power cut so the ACKs published meanwhile still reach it; a week bounds how long
# the broker keeps a session for a board that was retired.
persistent_client_expiration 7d
autosave_interval 30
