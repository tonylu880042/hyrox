[workspace]
resolver = "2"
members = ["crates/domain", "crates/contract", "crates/application", "crates/storage", "crates/transport", "crates/simulator", "apps/hub-server"]

[workspace.package]
edition = "2021"
rust-version = "1.83"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
