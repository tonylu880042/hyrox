[package]
name = "simulator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Depends on the wire contract only. An emulated ESP32 knows no business meaning
# (CLAUDE.md 8), so it must not be able to reach the domain or the store.
[dependencies]
mqtt = { path = "../mqtt", default-features = false }
serde = { workspace = true }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
