[package]
name = "transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Delivery only: topics, QoS, the broker client. What is carried is `contract`; what the
# hub does with it is `application`. Neither is reachable from here in the other direction
# (CLAUDE.md 3).
#
# `rumqttc` sits behind the `broker` feature so the topic scheme and the status payloads
# can be compiled and tested with no broker anywhere in the build (CLAUDE.md 24).
[dependencies]
contract = { path = "../contract" }
domain = { path = "../domain" }
serde = { workspace = true }
serde_json = { workspace = true }
rumqttc = { version = "0.24", optional = true }

[features]
default = ["broker"]
broker = ["dep:rumqttc"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
