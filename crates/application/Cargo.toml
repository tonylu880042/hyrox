[package]
name = "application"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Depends on `domain` (the rules) and on `contract` (what the edge and the hub agreed on),
# and on nothing else (CLAUDE.md 3). No axum, no sqlx, no storage, and — since ADR 0005 —
# no transport: persistence and delivery are ports here, `crates/storage` and
# `crates/transport` are the adapters, so every dependency arrow points inward.
[dependencies]
domain = { path = "../domain" }
contract = { path = "../contract" }
serde = { workspace = true }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
